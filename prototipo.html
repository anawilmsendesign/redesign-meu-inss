<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protótipo Interativo — Redesign Meu INSS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 18px;
    }

    /* Barra superior fora do celular */
    .top-bar {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-voltar-site {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: #ffffff;
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
      transition: background 0.2s, transform 0.15s;
    }

    .btn-voltar-site:hover {
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .status-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .screen-badge {
      background: #1d4ed8;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
    }

    .btn-hint {
      background: transparent;
      border: 1px solid #94a3b8;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-hint:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    /* Moldura do celular */
    .phone-frame {
      background: #111827;
      padding: 14px;
      border-radius: 40px;
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.28),
        0 0 0 2px #334155;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .phone-speaker {
      width: 64px;
      height: 5px;
      background: #374151;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    /* Container que acompanha o tamanho exato da imagem */
    .screen-stage {
      position: relative;
      display: inline-block;
      border-radius: 26px;
      overflow: hidden;
      background: #ffffff;
      line-height: 0;
    }

    .screen-img {
      display: block;
      max-height: 76vh;
      max-width: 86vw;
      width: auto;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.15s ease;
    }

    /* Áreas clicáveis invisíveis sobre a imagem */
    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .hotspot:hover {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
    }

    .hotspot:active {
      background: rgba(15, 23, 42, 0.12);
    }

    /* Modo de destaque opcional para ver onde estão os botões */
    .show-hints .hotspot {
      background: rgba(37, 99, 235, 0.22);
      box-shadow: inset 0 0 0 2px #2563eb;
    }

    /* Posições dos 4 botões na tela inicial */
    .btn-extratos {
      top: 21.2%;
      left: 7.5%;
      width: 85%;
      height: 13.8%;
      border-radius: 20px;
    }

    .btn-agendar {
      top: 39.3%;
      left: 7.5%;
      width: 85%;
      height: 13.8%;
      border-radius: 20px;
    }

    .btn-prova {
      top: 57.4%;
      left: 7.5%;
      width: 85%;
      height: 13.8%;
      border-radius: 20px;
    }

    .btn-dados {
      top: 75.5%;
      left: 7.5%;
      width: 85%;
      height: 13.8%;
      border-radius: 20px;
    }

    /* Posição do botão Voltar (<) na barra azul inferior das telas internas */
    .btn-voltar-app {
      top: 93.2%;
      left: 66%;
      width: 34%;
      height: 6.8%;
    }

    .hidden {
      display: none;
    }

    .helper-text {
      font-size: 13px;
      color: #475569;
      text-align: center;
      max-width: 420px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-voltar-site">← Voltar ao relatório</a>

    <div class="status-wrap">
      <span id="screenBadge" class="screen-badge">Tela inicial</span>
      <button type="button" id="toggleHints" class="btn-hint">Mostrar cliques</button>
    </div>
  </div>

  <div class="phone-frame">
    <div class="phone-speaker"></div>

    <div id="screenStage" class="screen-stage">
      <img id="screenImg" class="screen-img" src="imagens/inicial.png" alt="Tela do aplicativo Meu INSS">

      <!-- Botões clicáveis da TELA INICIAL -->
      <div id="homeHotspots">
        <button class="hotspot btn-extratos" onclick="irPara('extratos')" aria-label="Abrir Meus Extratos de Pagamento" title="Meus Extratos de Pagamento"></button>
        <button class="hotspot btn-agendar" onclick="irPara('agendar')" aria-label="Abrir Agendar Perícia" title="Agendar Perícia"></button>
        <button class="hotspot btn-prova" onclick="irPara('prova')" aria-label="Abrir Prova de Vida Digital" title="Prova de Vida Digital"></button>
        <button class="hotspot btn-dados" onclick="irPara('dados')" aria-label="Abrir Meus Dados Cadastrais" title="Meus Dados Cadastrais"></button>
      </div>

      <!-- Botão clicável VOLTAR (<) das telas internas -->
      <div id="backHotspot" class="hidden">
        <button class="hotspot btn-voltar-app" onclick="irPara('inicial')" aria-label="Voltar para a tela inicial" title="Voltar para a tela inicial"></button>
      </div>
    </div>
  </div>

  <p class="helper-text">
    Clique em qualquer opção na tela inicial para navegar. Nas telas internas, use a seta <strong>&lt;</strong> no canto inferior direito do celular para voltar.
  </p>

  <script>
    const telas = {
      inicial:  { src: "imagens/inicial.png",  titulo: "Tela inicial" },
      extratos: { src: "imagens/extratos.png", titulo: "Extratos de pagamento" },
      agendar:  { src: "imagens/agendar.png",  titulo: "Agendar perícia" },
      prova:    { src: "imagens/prova.png",    titulo: "Prova de vida digital" },
      dados:    { src: "imagens/dados.png",    titulo: "Meus dados cadastrais" }
    };

    const screenImg = document.getElementById("screenImg");
    const screenBadge = document.getElementById("screenBadge");
    const homeHotspots = document.getElementById("homeHotspots");
    const backHotspot = document.getElementById("backHotspot");
    const screenStage = document.getElementById("screenStage");
    const toggleHints = document.getElementById("toggleHints");

    // Pré-carrega as 5 imagens para a troca ser instantânea
    Object.values(telas).forEach(tela => {
      const img = new Image();
      img.src = tela.src;
    });

    function irPara(chave) {
      const destino = telas[chave];
      if (!destino) return;

      screenImg.style.opacity = "0.65";

      setTimeout(() => {
        screenImg.src = destino.src;
        screenImg.alt = destino.titulo;
        screenBadge.textContent = destino.titulo;

        if (chave === "inicial") {
          homeHotspots.classList.remove("hidden");
          backHotspot.classList.add("hidden");
        } else {
          homeHotspots.classList.add("hidden");
          backHotspot.classList.remove("hidden");
        }

        screenImg.style.opacity = "1";
      }, 80);
    }

    // Botão opcional para visualizar as áreas clicáveis
    toggleHints.addEventListener("click", () => {
      screenStage.classList.toggle("show-hints");
      const ativo = screenStage.classList.contains("show-hints");
      toggleHints.textContent = ativo ? "Ocultar cliques" : "Mostrar cliques";
    });
  </script>

</body>
</html>
